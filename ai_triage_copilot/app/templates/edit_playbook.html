{% extends "layout.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <header class="mb-8 text-center">
        <h2 class="text-4xl font-extrabold text-gray-900 dark:text-white">Edit Playbook: {{ playbook.category }}</h2>
    </header>

    <div class="max-w-4xl mx-auto bg-white dark:bg-gray-800 rounded-lg shadow-lg p-8">
        <form action="{{ url_for('playbooks.edit_playbook', category=playbook.category) }}" method="POST">
            <div class="mb-6">
                <label for="content" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Playbook Content (Markdown)</label>
                <textarea id="content" name="content" rows="20" required class="mt-1 block w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 transition font-mono">{{ playbook.content }}</textarea>
            </div>
            <div class="flex justify-end">
                <a href="{{ url_for('playbooks.list_playbooks') }}" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-md mr-2 transition">Cancel</a>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md transition">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
