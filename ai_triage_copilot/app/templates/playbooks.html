{% extends "layout.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <header class="mb-8 text-center">
        <h2 class="text-4xl font-extrabold text-gray-900 dark:text-white">Playbooks</h2>
        <p class="mt-2 text-lg text-gray-600 dark:text-gray-400">Manage and edit your incident response playbooks.</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        {% for playbook in playbooks %}
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden transform hover:-translate-y-1 hover:shadow-2xl transition-all duration-300 ease-in-out">
            <div class="p-6">
                <h3 class="text-xl font-bold text-gray-900 dark:text-white">{{ playbook.category }}</h3>
                <div class="prose dark:prose-dark max-w-none text-gray-700 dark:text-gray-300 mt-4">
                    {{ playbook.content | markdown }}
                </div>
                <div class="mt-6 text-right">
                    <a href="{{ url_for('playbooks.edit_playbook', category=playbook.category) }}" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-200 font-semibold text-sm transition">
                        Edit Playbook <i class="fas fa-edit ml-1"></i>
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
